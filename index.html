<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Gastos</title>
</head>

<body>

  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-tab="overview">
      <span class="bottom-nav-icon">🏠</span>
      <span class="bottom-nav-label">Overview</span>
    </button>
    <button class="bottom-nav-item" data-tab="transacoes">
      <span class="bottom-nav-icon">💸</span>
      <span class="bottom-nav-label">Transações</span>
    </button>
    <button class="fab-nav" id="btn-adicionar-fab">
      <span>+</span>
    </button>
    <button class="bottom-nav-item" data-tab="categorias">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">Categorias</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <main class="app">

    <header class="header">
      <div class="header-text">
        <p class="header-greeting">Bom dia 👋</p>
        <h1>Meus Gastos</h1>
      </div>
      <div class="header-avatar">C</div>
    </header>

    <section class="summary">
      <div class="card">
        <span>Total gasto</span>
        <strong id="total-gasto">R$ 0,00</strong>
      </div>
      <div class="card">
        <span>Limite mensal</span>
        <strong id="limite-mensal">R$ 3.000,00</strong>
      </div>
      <div class="card">
        <span>Disponível</span>
        <strong id="disponivel">R$ 3.000,00</strong>
      </div>
      <div class="card">
        <span>Utilizado</span>
        <strong id="percentual">0%</strong>
      </div>
    </section>

    <div class="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="transacoes">Transações</button>
      <button class="tab" data-tab="categorias">Categorias</button>
    </div>

    <div class="tab-content" id="tab-overview">
      <section class="chart-section">
        <div class="chart-header">
          <span class="chart-label">GASTO MENSAL</span>
          <strong id="chart-total">R$ 0,00</strong>
        </div>
        <div id="chart-gastos-container"></div>
      </section>

      <section class="categories-summary" id="categories-summary">
        <h2>Por categoria</h2>
        <ul id="categories-list"></ul>
      </section>

      <section class="recent-section">
        <div class="recent-header">
          <h2>Recentes</h2>
        </div>
        <ul id="recent-list"></ul>
      </section>
    </div>

    <div class="tab-content hidden" id="tab-transacoes">
      <section class="form-section hidden" id="form-section">
        <h2>Novo gasto</h2>
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Mercado" />
        </div>
        <div class="form-group">
          <label for="valor">Valor</label>
          <input type="number" id="valor" placeholder="Ex: 250" />
        </div>
        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Moradia">Moradia</option>
            <option value="Lazer">Lazer</option>
            <option value="Saúde">Saúde</option>
            <option value="Educação">Educação</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div class="form-group">
          <label for="data">Data</label>
          <input type="date" id="data" />
        </div>
        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="Fixa">Fixa</option>
            <option value="Variável">Variável</option>
          </select>
        </div>
        <div class="form-buttons">
          <button id="btn-cancelar">Cancelar</button>
          <button id="btn-salvar">Salvar gasto</button>
        </div>
      </section>

      <section class="filter-section">
        <select id="filtro-categoria">
          <option value="Todos">Todas as categorias</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Moradia">Moradia</option>
          <option value="Lazer">Lazer</option>
          <option value="Saúde">Saúde</option>
          <option value="Educação">Educação</option>
          <option value="Outros">Outros</option>
        </select>
      </section>

      <section class="expenses">
        <h2>Seus gastos</h2>
        <div class="empty-state" id="empty-state">
          <p>Nenhum gasto cadastrado.</p>
        </div>
        <ul class="expense-list" id="expense-list"></ul>
      </section>
    </div>

    <div class="tab-content hidden" id="tab-categorias">
      <section class="categories-summary">
        <h2>Resumo por categoria</h2>
        <ul id="categories-list-detail"></ul>
      </section>
    </div>

  </main>

  <script type="module" src="/src/main.ts"></script>

</body>

</html>
